<!DOCTYPE html>

<html>

<head>

    <title>Writing - IntelliLearn</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<nav class="navbar">

    <div class="logo">
        🌱 IntelliLearn
    </div>

    <div class="nav-links">

        <a href="/dashboard">Dashboard</a>

        <a href="/learn">Learn</a>

        <a href="/progress">Progress</a>

        <a href="/logout">Logout</a>

    </div>

</nav>


<section class="learning-section">


    <div class="learning-card">


        <h1>
            ✍️ Writing Practice
        </h1>


        <h3>
            Write the English word:
        </h3>


        <h2>
            పుస్తకం
        </h2>


        <form method="POST">


            <input
                type="text"
                name="answer"
                placeholder="Type English word"
                required>


            <br><br>


            <button
                type="submit"
                class="primary-btn">

                Check Answer

            </button>


        </form>


        {% if message %}

            <h3>
                {{ message }}
            </h3>

        {% endif %}


        <br>


        <a href="/learn">
            ← Back to Learn
        </a>


    </div>


</section>


</body>

</html>
